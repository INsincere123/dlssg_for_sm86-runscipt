[SystemSettings]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.DefragDynamicBounds=1
; 并行判断镜头范围内的物体，保留Config 2设置；收益取决于CPU瓶颈。
r.ParallelFrustumCull=1

; === 纹理流送：8GB预算作为第一轮实验，不是预先占满8GB显存 ===
; 保持按需加载，不强制加载全部纹理，避免增加系统内存与加载压力。
r.TextureStreaming=1
; UE4非零值允许运行时调整纹理池预算；它不是锁定显存或内存搬运开关。
r.Streaming.UseFixedPoolSize=1
; 8192MB是测试预算，不代表当前默认池一定更小，也不保证一定提帧。
; 独立缓存候选使用10240MB与8192MB对照；此正式配置保持8192MB。
; 若共享GPU内存、卡顿或系统内存压力上升，回退；不要同时改其他参数。
r.Streaming.PoolSize=8192
; 保留Config 2的库洛流送策略。0仅关闭自定义优先级，不是关闭纹理流送。
; 作者记录此策略可能改善某些资源异常，也可能使另外一些纹理加载更慢。
r.Streaming.UsingKuroStreamingPriority=0
; 本轮启用10作为流送组候选；原游戏默认值未知，需与原配置比较。
; 10表示每10帧完成一轮完整需求更新，可能省CPU，但转镜头后纹理清晰得更慢。
r.Streaming.FramesForFullUpdate=10

; === CPU动画：恢复更新频率优化 ===
; 1允许部分对象减少动画更新次数，降低CPU负担；远处动画可能不如关闭时顺滑。
a.URO.Enable=1
; 1允许根据对象在屏幕上占比决定动画更新频率，小对象可以少更新。
a.URO.EnableScreenRatio=1

; === 植被：收缩远景，保留近处细节 ===
; Config 2为2.0，正式为1.0；本远景候选0.9进一步缩减LOD距离。
foliage.LODDistanceScale=0.9
; 近层与中层距离保留；以下距离单位由游戏决定，不直接当作米数。
r.Kuro.Foliage.NearCullDistanceMax=9750
r.Kuro.Foliage.MiddleCullDistanceMax=15750
; Config 2为35000，正式为22500；本候选20250。
r.Kuro.Foliage.FarCullDistanceMax=20250
; 正式草地距离22500，本候选20250；可能更容易看到草地补出现。
r.Kuro.Foliage.GrassCullDistanceMax=20250
; 另一草地路径：Config 2为40000，正式35000，本候选31500。
r.Kuro.Foliage.Grass3_0CullDistanceMax=31500
; 保留Config 2飞行相关高度阈值，避免本轮额外改变飞行卸载表现。
wp.Runtime.SoraGridBlackListHeight=15000
; 保留植被绘制调用优化，1开启，不是草地密度设为1。
foliage.DensityScaleLOD.DrawCallOptimize=1

; === 模型和加载范围 ===
; Config 2为0.5，正式0.7，本候选0.8；让建筑、岩石等更早简化。
; 这里越大越早简化，与foliage.LODDistanceScale的方向不同。
r.StaticMeshLODDistanceScale=0.8
; Config 2为1.0；改0.9，小幅收缩计划加载范围，注意跑图是否出现补加载。
wp.Runtime.PlannedLoadingRangeScale=0.9
; 保留骨骼模型LOD基准FOV。不是把镜头视野设成150度，具体换算未确认。
r.Kuro.SkeletalMesh.DistanceLODBaseFOV=150.0

; === 后处理：保留原画面风格，只关闭色差 ===
; 0去掉边缘红蓝彩边。
r.SceneColorFringeQuality=0
; 下列可选项维持禁用状态：未主动关闭景深、暗角、泛光或特效模糊。
;r.DepthOfFieldQuality=0
;r.Tonemapper.Quality=1
;r.Kuro.KuroEnableFFTBloom=0
;r.Kuro.KuroEnableToonFFTBloom=0
;r.Kuro.NiagaraBlur.Enable=0

; === 阴影与环境光遮蔽：保留Config 2 ===
; 小物体阴影尺寸门槛，越小保留的细小阴影越多；不等于阴影距离。
r.Shadow.RadiusThreshold=0.01
; 单物体阴影分辨率上下限，主要关系到角色等阴影清晰度和GPU成本。
r.Shadow.PerObjectResolutionMax=768
r.Shadow.PerObjectResolutionMin=768
; 距离场AO半分辨率；1更细也更费性能。
r.AODownsampleFactor=2
; -1沿用游戏AO强度，不是关闭AO。
r.AmbientOcclusion.Intensity=-1
; AO质量上限100，不是强度100%。
r.AmbientOcclusionMaxQuality=100

; === 光束与体积光：GPU有余量，保留Config 2的细节 ===
; 丁达尔质量沿用1，各档位完整含义尚未确认。
r.TyndallScatteringQuality=1
; 下面均为降采样倍数，1偏精细，较大值通常更省GPU。
r.LightShaftDownSampleFactor=1
r.Kuro.KuroTyndallScatteringsDownSampleFactor=1
r.KuroVolumetricLight.ColorMaskDownSampleFactor=1
r.KuroVolumetricLight.DownSampleFactor=1

; === 反射与其他渲染细节：保留Config 2 ===
; SSR粗糙度阈值1.0，让更粗糙的表面也可尝试反射，不是反射强度。
r.SSR.MaxRoughness=1.0
; 0使用全分辨率场景颜色，反射更清楚；与光追无关。
r.SSR.HalfResSceneColor=0
; 普通放大滤镜质量，非DLSS档位、非插帧倍率。
r.Upscale.Quality=3
; 屏幕空间雾散射半分辨率。DownSampleFator为原参数拼写。
r.SSFS.DownSampleFator=2
; 关闭可变速率着色，保留细节。
r.VRS.Enable=0
; 下列FFT相关选项保持原值，具体档位含义未确认，不据名称强行调整。
r.Kuro.KuroFFTDynamicQuality=0
r.Kuro.KuroFFTHighQuality=2
; 不强制这条半透明路径使用全分辨率，具体材质覆盖范围未确认。
r.KuroDownsampleTranslucencyFullRes=false

[/Script/Engine.RendererSettings]
; 斜视地面纹理过滤上限16；涉及采样带宽，不是只增加显存占用。
r.MaxAnisotropy=16
; 关闭光追配置加载，给基础渲染和外部帧生成留余量。
r.RayTracing.LoadConfig=0
