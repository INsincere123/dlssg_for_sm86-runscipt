; 【远景候选】以下是相对正式配置的独立变更；更大StaticMeshLOD值一般更早简化，植被LOD比例方向相反。
; r.StaticMeshLODDistanceScale：0.7 → 0.8。回退用Engine.正式组合.ini。
; foliage.LODDistanceScale：1.0 → 0.9。回退用Engine.正式组合.ini。
; r.Kuro.Foliage.FarCullDistanceMax：22500 → 20250。回退用Engine.正式组合.ini。
; r.Kuro.Foliage.GrassCullDistanceMax：22500 → 20250。回退用Engine.正式组合.ini。
; r.Kuro.Foliage.Grass3_0CullDistanceMax：35000 → 31500。回退用Engine.正式组合.ini。
; 只小幅收缩远景，普通LOD对Nanite/自定义路径可能无效；保留近景相关设置。
; 正式配置：鸣潮流送优化
; 生成日期：2026-10-17；性能及画面效果待游戏内验证。
; 【流送组】原配置未覆盖下列三项，游戏运行时原值未知；10不是相对默认翻倍的保证。
; FramesForFullUpdate=10降低完整需求更新频率，可能省CPU，也可能让转镜头后贴图变清晰更慢。
; DefragDynamicBounds=1整理未使用的动态边界；LimitPoolSizeToVRAM=1按可用显存限制纹理池。
; 后两项若游戏已启用，没有额外收益；不等于把RAM移到VRAM，也不保证无共享显存。
; 单项回退：注释对应键；完整原样回退：使用Engine.原配置.ini（不要仅改回某个猜测默认值）。
; 本机配置：i7-12700H / RTX 3080 Ti Laptop 16GB / 系统内存16GB。
; 目标：4K输出，配合外部DLSSG争取显示120 FPS，优先减轻CPU和资源加载压力。
; 基于Config 2调整；性能收益、参数是否被当前游戏接受均待游戏内验证。
; 本文件不设置输出分辨率、DLSS档位、插帧倍率或帧率上限。
; Paths是资源搜索目录，按Config 2原样保留，不是画质开关。
; 分号开头的行不生效。游戏保存配置时可能清除注释，请保留此仓库副本。
; 恢复方法：部署前备份游戏原Engine.ini，需要恢复时换回备份。

