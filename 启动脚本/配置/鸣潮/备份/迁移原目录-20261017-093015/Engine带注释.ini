; Config 2 中文说明：只增加注释，保留原预设的全部参数、数值和启用状态。
; 你的目标：RTX 3080 Ti Laptop，4K 输出，使用外部 DLSSG 争取显示 120 FPS。
; 本文件不设置 DLSS 超分档位、插帧倍率或 120 FPS 上限；这些需要在游戏和启动脚本中另行设置。
; 更精细的画面会压低基础帧率，插帧也有开销，不能把显示帧率当成真实渲染帧率。
; 分号开头的是注释，不生效；例如 ;r.DepthOfFieldQuality=0 需要删掉最前面的分号才会启用。
; 建议一次只改一组，重启游戏后用同一场景对比画面和帧时间。
; 说明依据：UE 通用参数文档、作者的鸣潮说明；鸣潮专用参数未确认的部分明确标为未确认。
; 作者说明：https://alteriax.github.io/WuWa-Config-Info/
; UE4 说明：https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-reference?application_version=4.27

