; 作者提醒：游戏启动或重写配置时，注释可能消失；保留仓库里的说明版便于查阅。
; Config 2 增大了植被显示距离，可能比游戏默认设置更慢，它并不是纯粹的提帧预设。
; 如果菜单已关闭动态模糊，实际却仍出现，可在下面这一节单独添加 r.MotionBlur.Max=0。

; === 渲染参数区 ===
[SystemSettings]
; 将“判断哪些物体在镜头范围内”的工作并行处理，1 开启、0 关闭。
; 主要影响 CPU 的场景准备工作，不增加画面细节；实际能否提帧取决于瓶颈。
r.ParallelFrustumCull=1

; --- 后处理：镜头风格与画面清晰度 ---
; 下列五项目前均未启用，景深、暗角和泛光仍由游戏现有设置决定。
; 景深：0 关闭前后景虚化，背景更清楚，也可能改变过场镜头效果。
;r.DepthOfFieldQuality=0
; 色调映射质量：作者用 1 去掉暗角和胶片颗粒，也可能让部分场景显得更亮。
; 它不是亮度滑块，不能当作“1 比其他值画质更高”。
;r.Tonemapper.Quality=1
; 鸣潮 FFT 泛光开关：0 关闭这一类亮部光晕，画面可能更干净，但发光氛围减弱。
; 不代表关闭游戏里所有泛光；对哪些区域生效由当前版本决定。
;r.Kuro.KuroEnableFFTBloom=0
; 鸣潮 Toon FFT 泛光开关：0 关闭这条泛光路径；与上一项分别控制不同路径。
;r.Kuro.KuroEnableToonFFTBloom=0
; 鸣潮 Niagara 特效模糊开关：按名称判断 0 为关闭；具体影响哪些技能或粒子尚未确认。
; 不等同于全局动态模糊开关，不保证能清除所有特效模糊。
;r.Kuro.NiagaraBlur.Enable=0
; 色差：0 关闭画面边缘的红蓝彩边，轮廓更干净；1 开启。
r.SceneColorFringeQuality=0

; --- 阴影：小物体是否投影，以及角色阴影清晰度 ---
; 小物体阴影的屏幕尺寸门槛：越小越不容易省略细小或远处的阴影，但开销可能更高。
; 0.01 是较低门槛；这不是阴影距离，也不是阴影分辨率。
r.Shadow.RadiusThreshold=0.01
; 单物体阴影分辨率上限：768 主要改善角色等物体的阴影；提高通常更细腻，也更吃 GPU。
; 不控制所有场景阴影，游戏菜单的阴影档位仍会影响其他路径。
r.Shadow.PerObjectResolutionMax=768
; 单物体阴影分辨率下限：同设 768，限制这一类阴影使用更低分辨率来省开销。
; 提高下限会增加远处或较小对象的成本；游戏仍可能有额外限制。
r.Shadow.PerObjectResolutionMin=768

; --- 环境光遮蔽（AO）：墙角、脚底和物体交接处的暗部层次 ---
; 距离场 AO 降采样倍数：2 为半分辨率，1 为全分辨率。
; 1 通常更细、开销更高；本项不等同于所有 AO 效果的总开关。
r.AODownsampleFactor=2
; AO 强度覆盖：-1 使用游戏原本的强度，不是“负的阴影”，也不是关闭。
; 若改成非负值，通常越大交接处越黑；具体观感要在游戏内对比。
r.AmbientOcclusion.Intensity=-1
; 屏幕空间 AO 质量上限：100 允许高质量，不代表强度 100%，也不保证 AO 一定开启。
; 实际质量还受菜单、材质和其他参数影响；降低可能省开销，也可能让暗部粗糙。
r.AmbientOcclusionMaxQuality=100

; --- 植被与视距：跑图时远处的树、草是否保留 ---
; 植被 LOD 距离倍率：2.0 让植被更晚换成简化模型，远处更饱满，但可能降低基础帧率。
; 降到 1.0 可作为性能对比；它不等于“所有草的显示距离翻倍”。
foliage.LODDistanceScale=2.0
; 近层植被的最大裁剪距离：越大越晚消失，但会增加可见植被；并非屏幕像素数。
; Near/Middle/Far 是游戏分组，不能假定所有植被都依次经过这三个层级。
r.Kuro.Foliage.NearCullDistanceMax=9750
; 中层植被最大裁剪距离：方向同上，调小可能减少负载，也更容易看到突然消失。
r.Kuro.Foliage.MiddleCullDistanceMax=15750
; 远层植被最大裁剪距离：35000 偏向保留远景；Config 3 使用 22500，可作降负载对照。
r.Kuro.Foliage.FarCullDistanceMax=35000
; 普通草地最大裁剪距离：越大远处草越多；Config 3 为 22500，适合比较跑图开销。
r.Kuro.Foliage.GrassCullDistanceMax=35000
; 另一条 Grass3_0 草地路径的最大裁剪距离：不要默认上一项覆盖它。
; 当前 40000，Config 3 为 35000；是否用于当前区域由游戏决定。
r.Kuro.Foliage.Grass3_0CullDistanceMax=40000
; 作者描述为飞行时灯光熄灭或物体卸载的高度阈值；提高用于推迟这种变化。
; 不是普通地面视距。高度基准和具体作用网格未确认，不把 15000 直接换算成离地米数。
wp.Runtime.SoraGridBlackListHeight=15000

; --- 资源加载与模型 LOD：远景细节、纹理加载和跑图开销 ---
; 库洛纹理流送优先级策略：0 关闭该自定义策略，不是关闭纹理流送本身。
; 作者列出的其他档位为 1 仅保留优先级、2 仅加载优先级、3 两者都用。
; 不保证 0 总是更快；作者也记录了关闭后某些纹理加载变慢的情况。
r.Streaming.UsingKuroStreamingPriority=0
; 静态模型 LOD 距离倍率：越小越晚切换简化模型，远处建筑、岩石更细，但更费性能。
; 0.5 偏画质；与上面的 foliage.LODDistanceScale 方向相反，不要看反。
r.StaticMeshLODDistanceScale=0.5
; 计划资源加载范围倍率：1.0 保留本预设的加载范围；减小可能省资源，但容易看到远景补加载。
; 它涉及资源加载，并不直接决定所有物体的可见距离；不能保证超过 1.0 继续改善。
wp.Runtime.PlannedLoadingRangeScale=1.0
; 鸣潮骨骼模型距离 LOD 使用的基准 FOV 参数，涉及角色等带骨骼模型如何选择细节等级。
; 150.0 不是把玩家镜头视野设为 150 度；具体换算和增减方向未确认，建议保留。
r.Kuro.SkeletalMesh.DistanceLODBaseFOV=150.0

; --- 光照：穿过雾气的光束、光柱与体积光 ---
; 鸣潮丁达尔散射质量参数：本预设为 1，Config 3 为 0。
; 用来比较光束散射效果；各档位具体差别及 0 是否完全关闭尚未确认。
r.TyndallScatteringQuality=1
; 光柱降采样倍数：1 更精细，2 等更大值使用更低分辨率，通常更省 GPU。
r.LightShaftDownSampleFactor=1
; 库洛丁达尔散射的降采样倍数：1 保留较细光束，提高值可测试节省开销。
; 与上一项控制不同路径，不保证所有场景同时生效。
r.Kuro.KuroTyndallScatteringsDownSampleFactor=1
; 体积光颜色遮罩的降采样倍数：1 偏精细，提高值可能降低光照边界的细节。
r.KuroVolumetricLight.ColorMaskDownSampleFactor=1
; 体积光本身的降采样倍数：1 偏精细，2/4 等较大值通常更省性能，但光照可能变粗。
r.KuroVolumetricLight.DownSampleFactor=1

; --- 反射、动画与其他细节 ---
; 屏幕空间反射（SSR）的粗糙度阈值：1.0 允许更粗糙的表面继续尝试反射。
; 不是“反射强度 100%”；阈值较高可能扩大计算范围，屏幕外物体仍无法靠 SSR 完整反射。
r.SSR.MaxRoughness=1.0
; SSR 使用的场景颜色分辨率：0 全分辨率、1 半分辨率。
; 当前优先清晰度，半分辨率可能省开销，但反射更糊；不是光追反射开关。
r.SSR.HalfResSceneColor=0
; 骨骼动画更新频率优化：0 关闭“少更新几次动画来省 CPU”的优化，部分动画可能更顺。
; 代价是 CPU 动画负担可能增加；不是提升游戏总帧率的开关，也不保证修复所有低帧动画。
a.URO.Enable=0
; 按物体在屏幕上占比来降低动画更新频率的优化：0 关闭这一策略。
; 与上项相关；上项关闭后，本项可能不再额外改变效果。
a.URO.EnableScreenRatio=0
; 普通空间放大滤镜质量：3 对应 UE4 的较高质量滤镜，本项目也用它改善部分 UI 表现。
; 不是 DLSS 的质量档或插帧倍率；不同渲染路径可能不使用它，不建议盲目继续加大。
r.Upscale.Quality=3
; 屏幕空间雾散射的降采样：2 半分辨率，1 全分辨率，4 四分之一分辨率。
; 数值越小雾的边界通常越细、开销越高。键名 DownSampleFator 是原项目写法，不要自行纠正拼写。
r.SSFS.DownSampleFator=2
; 可变速率着色（VRS）：0 关闭，避免部分区域用更粗的着色换性能。
; 改为 1 可能节省 GPU，但细节可能变粗；实际收益取决于游戏实现与场景。
r.VRS.Enable=0
; 鸣潮 FFT 相关效果的动态质量开关：按命名判断 0 禁用自动质量变化。
; 具体关联泛光还是其他效果、按什么负载调整，尚未确认，不承诺关闭就能提帧。
r.Kuro.KuroFFTDynamicQuality=0
; 鸣潮 FFT 相关效果的质量参数，本预设为 2；与上一项属于同一组。
; 数字与画质高低的对应关系未确认，不能认定越大越清晰，建议保留作者值。
r.Kuro.KuroFFTHighQuality=2
; 库洛降采样半透明渲染的全分辨率选项：false 不强制这条路径使用全分辨率。
; 按名称推断可能影响透明特效的清晰度和开销；具体适用材质与区域尚未确认。
r.KuroDownsampleTranslucencyFullRes=false
; 植被密度 LOD 的绘制调用优化：1 开启、0 关闭，目的是减少提交植被绘制的开销。
; 不等于把草地密度设为 1，也不保证在所有场景提高 FPS。
foliage.DensityScaleLOD.DrawCallOptimize=1

; === 引擎渲染设置区：下面两项保留在原节内，不要随意挪到其他节 ===
[/Script/Engine.RendererSettings]
; 各向异性过滤上限：16 改善斜视地面、道路等纹理的清晰度；8 可作性能对照。
; 不是纹理分辨率，也不代表占用 16GB 显存；实际效果还取决于材质和过滤设置。
r.MaxAnisotropy=16
; 鸣潮光追配置加载开关：0 按本预设禁用光追加载。
; 想测试光追需退出游戏后改为 1，再结合游戏菜单设置；仅改 1 不代表光追一定开启。
; 对你的 4K 插帧 120 FPS 目标，先保持 0，给基础渲染和帧生成留 GPU 余量。
r.RayTracing.LoadConfig=0
