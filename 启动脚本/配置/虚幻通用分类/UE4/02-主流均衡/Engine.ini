; RTX 30系通用性能候选 / UE4 / 02-主流均衡
; 日期：2026-10-24；目标参考：RTX 3070/3070 Ti Laptop、桌面RTX 3060 Ti附近
; 第一档是高性能硬件的均衡优化，第四档取舍更大；档位不代表游戏内最高/最低预设。
; 第二轮：结合第二参考UET筛选流送与Nanite参数；具体取舍见第二参考优化说明.md。
; 来源：UE4and5CommOpti 9f35a3d26624d4d0cfea472a94cdeee2856a44e6，结合个人鸣潮/异环配置；详见分类目录README及来源快照。
; 未进行游戏运行、画面、帧时间或显存验收，不保证兼容或提升FPS。
; 不设置输出/内部渲染分辨率、DLSS/RR、插帧倍率、帧率上限、同步、固定纹理/Nanite池或全局纹理MipBias。
; 不包含插件Paths、厂商专用参数，不关闭日志/崩溃报告，不强制光照、反射、抗锯齿或Nanite方法。
; 所有值为绝对覆盖；若游戏本来设置更低，部分覆盖可能增加开销。菜单不保证能覆盖SystemSettings。
; 使用前备份原Engine.ini；通过现有脚本-EngineConfigSource单独测试，不直接覆盖游戏原件。

[SystemSettings]

; 纹理与动画：保持按需流送，不写固定纹理池；URO仅对游戏已配置的对象生效。
; 不固定完整流送更新间隔：2偏向响应、10偏向节省CPU，均需按具体游戏验证。
; 不强制已用纹理最高mip常驻；按纹理预算分配偏移，仅在游戏已有MipBias时有相应作用。
r.TextureStreaming=1
r.Streaming.DefragDynamicBounds=1
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.FullyLoadUsedTextures=0
r.Streaming.UsePerTextureBias=1
a.URO.Enable=1

; 远景与草木：距离缩放依赖资源设置；StaticMesh值越大越早简化，植被距离值越小越早简化。
r.ViewDistanceScale=0.75
r.StaticMeshLODDistanceScale=1.25
foliage.LODDistanceScale=0.8
grass.CullDistanceScale=0.8

; 传统阴影：第一档仅缩短距离，精度和级联沿用游戏；后续档位显式限制精度和级联。VSM不由这组控制。
r.Shadow.DistanceScale=0.75
r.Shadow.MaxResolution=2048
r.Shadow.CSM.MaxCascades=3

; 过滤与后处理：第一档保持16倍过滤，去掉色差；第二档起缩减装饰性后处理，第四档关闭景深和光晕。
r.MaxAnisotropy=16
r.SceneColorFringeQuality=0
r.DepthOfFieldQuality=1
r.BloomQuality=4
r.LensFlareQuality=1

; 体积雾：不强制启停；较大XY像素与较少Z切片更粗，可能出现条带/漏光，异常时回退本组。
r.VolumetricFog.GridPixelSize=12
r.VolumetricFog.GridSizeZ=96

; UE4 SSR：不切换反射方法，不修改游戏光追；仅影响游戏已有SSR路径。第一档沿用游戏。
r.SSR.Quality=2
r.SSR.HalfResSceneColor=1
