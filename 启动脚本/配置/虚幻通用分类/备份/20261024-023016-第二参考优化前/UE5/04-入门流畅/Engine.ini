; RTX 30系通用性能候选 / UE5 / 04-入门流畅
; 日期：2026-10-24；目标参考：RTX 3050/3050 Ti Laptop、桌面RTX 3050附近
; 第一档是高性能硬件的均衡优化，第四档取舍更大；档位不代表游戏内最高/最低预设。
; 来源：UE4and5CommOpti 9f35a3d26624d4d0cfea472a94cdeee2856a44e6，结合个人鸣潮/异环配置；详见分类目录README及来源快照。
; 未进行游戏运行、画面、帧时间或显存验收，不保证兼容或提升FPS。
; 不设置输出/内部渲染分辨率、DLSS/RR、插帧倍率、帧率上限、同步、固定纹理/Nanite池或全局纹理MipBias。
; 不包含插件Paths、厂商专用参数，不关闭日志/崩溃报告，不强制光照、反射、抗锯齿或Nanite方法。
; 所有值为绝对覆盖；若游戏本来设置更低，部分覆盖可能增加开销。菜单不保证能覆盖SystemSettings。
; 使用前备份原Engine.ini；通过现有脚本-EngineConfigSource单独测试，不直接覆盖游戏原件。

[SystemSettings]

; 纹理与动画：保持按需流送，不写固定纹理池；URO仅对游戏已配置的对象生效。
; 完整流送需求每10帧更新可能省CPU，也可能延迟贴图清晰；跑图恶化先单独撤销该项。
r.TextureStreaming=1
r.Streaming.DefragDynamicBounds=1
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.FramesForFullUpdate=10
a.URO.Enable=1

; 远景与草木：距离缩放依赖资源设置；StaticMesh值越大越早简化，植被距离值越小越早简化。
r.ViewDistanceScale=0.55
r.StaticMeshLODDistanceScale=1.75
foliage.LODDistanceScale=0.5
grass.CullDistanceScale=0.5

; 传统阴影：第一档仅缩短距离，精度和级联沿用游戏；后续档位显式限制精度和级联。VSM不由这组控制。
r.Shadow.DistanceScale=0.5
r.Shadow.MaxResolution=512
r.Shadow.CSM.MaxCascades=1

; 过滤与后处理：第一档保持16倍过滤，去掉色差；第二档起缩减装饰性后处理，第四档关闭景深和光晕。
r.MaxAnisotropy=4
r.SceneColorFringeQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=3
r.LensFlareQuality=0

; 体积雾：不强制启停；较大XY像素与较少Z切片更粗，可能出现条带/漏光，异常时回退本组。
r.VolumetricFog.GridPixelSize=24
r.VolumetricFog.GridSizeZ=48

; UE5 Lumen：仅在游戏已使用对应路径时生效；不强制启用GI、不切换软硬件光追、不关闭时间滤波和屏幕追踪。
r.Lumen.Reflections.MaxRoughnessToTraceClamp=0.15
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.05
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.Reflections.DownsampleFactor=2

; UE5 VSM：不切换阴影方法；第一档沿用游戏采样，后续减少SMRT每射线采样。保留阴影，不关闭Nanite。
r.Shadow.Virtual.ResolutionLodBiasLocal=2
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=2.5
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=1
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=1

; Nanite、硬件光追、MegaLights及GI更新预算沿用游戏，不以关闭它们换取未知的画面缺失。
