; Steam UE5 通用候选，参考异环通用参数；逐游戏验证支持情况与画质。
; 不强制 Lumen、DLSS、光追、分辨率、帧率或同步，不包含游戏专用 Paths。
; 不保证减少卡顿或提升 FPS；不扩大纹理池或 Nanite 池。
[SystemSettings]
r.TextureStreaming=1
r.Streaming.FramesForFullUpdate=10
r.Streaming.DefragDynamicBounds=1
r.Streaming.LimitPoolSizeToVRAM=1
; 仅对支持 URO 的动画对象有效。
a.URO.Enable=1
; 适度简化远景、草木；Nanite/自定义路径可能不受影响。
r.ViewDistanceScale=0.85
r.StaticMeshLODDistanceScale=1.1
foliage.LODDistanceScale=0.9
grass.CullDistanceScale=0.9
; 传统阴影距离，保留人物近处阴影精度；VSM 可能不受影响。
r.Shadow.DistanceScale=0.85
r.MaxAnisotropy=16
r.SceneColorFringeQuality=0
