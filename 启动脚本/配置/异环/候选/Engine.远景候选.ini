; 【远景候选】以下是相对正式配置的独立变更；更大StaticMeshLOD值一般更早简化，植被LOD比例方向相反。
; r.StaticMeshLODDistanceScale：1.0 → 1.1。回退用Engine.正式组合.ini。
; foliage.LODDistanceScale：1.0 → 0.9。回退用Engine.正式组合.ini。
; r.ViewDistanceScale：0.9 → 0.85。回退用Engine.正式组合.ini。
; 只小幅收缩远景，普通LOD对Nanite/自定义路径可能无效；保留近景相关设置。
; 正式配置：异环流送＋城市与加载
; 生成日期：2026-10-17；性能及画面效果待游戏内验证。
; 【流送组】原配置未覆盖下列三项，游戏运行时原值未知；10不是相对默认翻倍的保证。
; FramesForFullUpdate=10降低完整需求更新频率，可能省CPU，也可能让转镜头后贴图变清晰更慢。
; DefragDynamicBounds=1整理未使用的动态边界；LimitPoolSizeToVRAM=1按可用显存限制纹理池。
; 后两项若游戏已启用，没有额外收益；不等于把RAM移到VRAM，也不保证无共享显存。
; 单项回退：注释对应键；完整原样回退：使用Engine.原配置.ini（不要仅改回某个猜测默认值）。
; 【异环城市与加载组】参考AlteriaX/NTE-Configs，按用户要求默认国服接受；实际语义/收益未实测。
; Crowd/VehicleSpawnerScale=0.9是人群/行驶车辆规模候选，ParkedVehicleSpawnerScale=0.9是停放车辆规模候选。
; DriveVehicleDensity=0.8是行驶车辆密度候选；Grid/HLODLoadingRangeScale=0.9是加载范围候选。
; 原配置没有这些覆盖，原默认值未知；0.9不能解读为比游戏当前恰好少10%。
; 不覆盖GridLoadingRangeLevel或人群/车辆LOD数量预算；留意车辆补出现、碰撞及建筑加载。
; 回退城市组：使用Engine.仅流送.ini；回退流送组：使用Engine.仅城市.ini；全回退用Engine.原配置.ini。
; 异环国服 Engine.ini：保守性能候选配置
; 整理日期：2026-10-17
; 参考：AlteriaX/NTE-Configs异环专用参数、Epic UE5流送文档；保留当前近景与光照取舍。
; 保留近景、适度收缩远景、按需流送；不复制库洛专用参数和资源路径。
; Config 3不代表比Config 2更费性能；此文件是跨游戏适配，不是参数逐项复制。
; 按用户要求默认国服接受社区专有参数；具体默认值、运行表现与性能收益待验证。
; 本文件是明文配置源文件，仅放在本目录不会生效。
; 已由用户验证：游戏也能读取明文 Engine.ini；当前脚本部署明文只读副本；各项性能收益仍待比较。
; 默认由异环启动脚本备份原文件、生成明文只读副本、链接部署、退出恢复。
; 不要直接用此文件覆盖游戏唯一的原 Engine.ini。
; 不设置分辨率、DLSS档位、光线重建、帧生成、帧率上限或垂直同步。
; 不包含原文件中的 CachedClientID；部署时应保留原配置内容。
; 分号开头为注释，不生效。每轮仅调整一个方向并比较同一场景。

[SystemSettings]
wp.Runtime.HLODLoadingRangeScale=0.9
wp.Runtime.GridLoadingRangeScale=0.9
HTAISpawnCache.DriveVehicleDensity=0.8
MassParkedVehicleSpawner.MassParkedVehicleSpawnerScale=0.9
HTMassVehicleSpawner.HTMassVehicleSpawnerScale=0.9
HTMassCrowdSpawner.HTMassCrowdSpawnerScale=0.9
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.DefragDynamicBounds=1

; === 纹理流送：保留按需加载 ===
; 不强制全量加载纹理，池大小先交给游戏管理。
r.TextureStreaming=1
; 鸣潮使用8192MB测试预算；异环的其他显存开销尚未测量，不直接沿用。
; PoolSize是纹理池预算，不是整个游戏的显存上限，也不是预先分配量。
; 仅确认显存余量与流送瓶颈后，再单独启用下面的预算实验。
;r.Streaming.PoolSize=8192
; 更新间隔增大可能减轻CPU开销，但转镜头后贴图变清晰可能更慢。
r.Streaming.FramesForFullUpdate=10

; === 动画：允许对象使用更新频率优化 ===
; 保留此前启用的URO以减轻CPU动画压力，不套用社区预设ForceAnimRate=1。
; 仅对游戏已配置支持该机制的对象有用；不是强制所有NPC降频。
; 远处动画可能更不连贯，若出现明显影响可注释回退。
a.URO.Enable=1

; === 远景：小幅收缩，保留近景 ===
; 乘以对象配置的最大绘制距离；没有该距离限制的对象不一定受影响。
; 正式视距为0.9，本候选0.85；游戏默认值未知。
r.ViewDistanceScale=0.85
; 正式静态模型比例1.0，本候选1.1；不照搬鸣潮设置。
; 更大值一般更早切换简化模型；Nanite或自定义LOD路径可能不受影响。
r.StaticMeshLODDistanceScale=1.1
; 正式植被LOD比例1.0，本候选0.9；不是植被密度。
foliage.LODDistanceScale=0.9
; 若郊外仍是瓶颈，可分别测试减少草木密度；仅支持缩放的植被有效。
;foliage.DensityScale=0.8
;grass.DensityScale=0.8

; === 纹理过滤：参考Config 3保留斜视地面清晰度 ===
; 上限16不是纹理分辨率；可能增加少量采样开销，性能对照可测试8。
r.MaxAnisotropy=16

; === 后处理：沿用鸣潮关闭色差的选择 ===
; 去掉边缘红蓝彩边，性能收益通常有限。
r.SceneColorFringeQuality=0
; 以下默认不启用，保留游戏景深、动态模糊和泛光选择。
;r.DepthOfFieldQuality=0
;r.MotionBlurQuality=0
;r.BloomQuality=3

; === 阴影：可选实验，先保留游戏设置 ===
; 仅适用于支持这些参数的阴影路径，不能当作虚拟阴影贴图通用控制。
; 缩短阴影距离可能增加远处阴影突然出现。
;r.Shadow.DistanceScale=0.8
; 降低传统阴影贴图上限可能让角色或场景阴影更模糊。
;r.Shadow.MaxResolution=1024

; === Lumen：确认当前光照/反射路径后才测试 ===
; 不强制打开或关闭Lumen，不猜测游戏GIMethod/ReflectionMethod枚举。
; 下列为候选绝对值，需先比较游戏当前值；不能保证比当前档位更省。
; 增大探针降采样倍数可能降低间接光开销，也可能丢失小细节、增加噪点。
;r.Lumen.ScreenProbeGather.DownsampleFactor=32
; 反射降采样可能降低计算开销，但反射可能更模糊或不稳定。
;r.Lumen.Reflections.DownsampleFactor=2

; === 普通SSR：与Lumen反射分开测试 ===
; 仅对采用屏幕空间反射的路径有意义，不强制切换反射方法。
;r.SSR.Quality=2
;r.SSR.HalfResSceneColor=1

; 不设置r.Kuro.*、Kuro流送优先级、鸣潮世界分区参数或鸣潮插件Paths。
; 不强制关闭光追初始化、VRS或修改线程/异步加载预算，避免未经验证的覆盖。
