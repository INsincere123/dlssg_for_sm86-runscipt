; 分组对照：仅新增Lumen组，远景/阴影/草地恢复本轮修改前；以下综合说明作为来源参考。
; 异环 UE5.6：按用户偏好整理的综合性能候选
; 日期：2026-10-17；目标为减少卡顿、稳定接近插帧后120 FPS，不保证达成。
; 保留主要反射、整体间接光、人物近处阴影；仅适度缩减远景及不显眼反射。
; 人群/车辆保持上一轮候选值；泛光、景深和游戏内动态模糊选择保持不变。
; 温度问题本轮不处理。参数支持按用户约定，性能与画面稳定性仍待实测。
; 由现有脚本从明文源生成只读临时副本；不直接覆盖游戏配置、临时副本设为只读。
; 不调整分辨率、DLSS/RR、插帧倍率、帧率上限、同步或游戏GI/反射方法。
; 不强制打开Lumen；以下Lumen参数仅对当前已启用的对应路径有意义。
; 完整回退本轮：用Engine.偏好优化前.ini替换此源文件，关闭游戏后下次启动读取。
; 分组对照见偏好优化说明.md；旧版Engine.原配置.ini仍保留更早的基线。
; Epic UE5.6 Lumen：https://dev.epicgames.com/documentation/zh-cn/unreal-engine/lumen-performance-guide-for-unreal-engine?application_version=5.6
; 异环专用社区参考：https://github.com/AlteriaX/NTE-Configs

[SystemSettings]

; === 纹理与流送：保持上一轮，不以缺失的内存数据猜测扩大缓存 ===
r.TextureStreaming=1
; 原10，本轮保持；可能省CPU但贴图需求更新响应较慢，跑图仍卡时单独比较撤掉覆盖。
r.Streaming.FramesForFullUpdate=10
; 原均为1；若游戏原本已启用，不产生额外收益，也不保证避免共享显存。
r.Streaming.DefragDynamicBounds=1
r.Streaming.LimitPoolSizeToVRAM=1
; 不覆盖纹理池/Nanite池，不强制全部mip常驻。容量预算并非零成本画质开关。

; === 城市与加载：按用户偏好保留现有六项 ===
; 以下默认值未知，0.9不表示相对当前游戏恰好减少10%。不继续削减人群/车辆数量。
HTMassCrowdSpawner.HTMassCrowdSpawnerScale=0.9
HTMassVehicleSpawner.HTMassVehicleSpawnerScale=0.9
MassParkedVehicleSpawner.MassParkedVehicleSpawnerScale=0.9
HTAISpawnCache.DriveVehicleDensity=0.8
wp.Runtime.GridLoadingRangeScale=0.9
wp.Runtime.HLODLoadingRangeScale=0.9
; 不猜测GridLoadingRangeLevel，不覆盖NPC/车辆LOD数量预算。

; === CPU动画：保留原1，不强制角色降频 ===
; 只对游戏已配置支持URO的对象有效，不等于优化所有AI、交通或物理。
a.URO.Enable=1

; === 远景与草木：小幅收缩，回退值在各项上方 ===
; 原0.9 → 0.85；仅影响支持最大绘制距离缩放的对象。留意建筑/小物件补出现。
r.ViewDistanceScale=0.9
; 原1.0 → 1.1；普通静态网格更早切简化模型，Nanite/自定义LOD可能不受影响。
r.StaticMeshLODDistanceScale=1.0
; 原1.0 → 0.9；更早使用简化植被，不修改密度，避免近处变稀。
foliage.LODDistanceScale=1.0
; 原未覆盖 → 0.9候选；缩短支持UE草地路径的剔除距离，不是把密度改成90%。
; 分组对照未启用：grass.CullDistanceScale=0.9

; === 阴影：只缩减传统方向光阴影距离，不降低角色阴影分辨率 ===
; 原未覆盖 → 0.85候选；原运行时值未知。VSM/自定义阴影路径可能不受此项影响。
; 分组对照未启用：r.Shadow.DistanceScale=0.85
; 保留游戏自身阴影贴图精度、级联数量、接触阴影和虚拟阴影页预算。

; === Lumen反射：保留光滑表面，减少较粗糙表面的专用追踪 ===
; 原未覆盖 → 0.3候选（不是官方推荐档位）；低于阈值保留专用反射，高于阈值用近似。
; 不按物体名称保留反射：车漆/水面/玻璃中粗糙度较高的部分也可能改变，需要截图核对。
r.Lumen.Reflections.MaxRoughnessToTraceClamp=0.3
; 原未覆盖 → 0.2，参考5.6 High；不用激进的0。材质分类还包括次表面，不仅是树草。
; 若角色皮肤/植被高光明显改变，先注释此项单独回退。
r.Lumen.Reflections.MaxRoughnessToTraceForFoliage=0.2
; 保留反射分辨率、时间滤波、屏幕追踪和透明前层反射；不覆盖Allow或强制转SSR。

; === Lumen间接光：只简化缓存探针精度，不放慢更新或扩大屏幕探针间距 ===
; 原未覆盖 → 16，参考5.6 High；若当前已为16则无收益，若更低则可能反而增大开销。
; 仍可能影响缓存间接光细节；出现噪点/闪烁即注释回退，不把“保留稳定性”当作保证。
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
; 不改更新预算/UpdateFactor、ScreenProbeGather.DownsampleFactor、ShortRangeAO和背面光照。
; 不强制异步计算、实验性反射RadianceCache复用或5.8 Lumen Lite，不提高光追追踪次数。

; === 纹理过滤与后处理：按偏好保持 ===
; 原16；涉及采样带宽，不是只占VRAM的选项。
r.MaxAnisotropy=16
; 原0，仅去掉色差；泛光、景深、动态模糊、曝光及色调映射沿用游戏。
r.SceneColorFringeQuality=0
